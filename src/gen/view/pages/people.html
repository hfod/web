{# vim:ft=htmldjango:
#}
<h2>Speakers</h2>
<p>Who have given at least one talk.</p>
<div class="records-list">
    <table>
        <tr>
            <th>name</th>
            <th>last presented</th> {# TODO Last talk topic/title. #}
            <th>website</th>
        </tr>
        {% for row in table %}
        <tr>
            <td><a href="/people/{{ row.person.id }}">{{ row.person.name }}</a></td>
            <td>{{ row.last_active }}</td>
            <td>
                {% if let Some(url) = row.person.website %}
                    <a href="{{ url }}">{{ url }}</a>
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
