{# vim:ft=htmldjango:
#}
<h2>Speakers</h2>
<p>People who have given at least one talk.</p>
<div class="records-list">
    <table>
        <tr>
            <th>name</th>
            <th>last talk</th> {# TODO Maybe last talk topic/title? #}
            <th>website</th>
        </tr>
        {% for row in table %}
        <tr>
            <td><a href="{{ web_path::person(row.person).display() }}">{{ row.person.name }}</a></td>
            <td>{{ row.last_active }}</td>
            <td>
                {% if let Some(url) = row.person.website %}
                    <a href="{{ url }}">{{ url }}</a>
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
