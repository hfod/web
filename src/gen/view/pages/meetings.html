{# vim:ft=htmldjango:
#}
<h2>Meetings</h2>
<div class="records-list">
    <table>
        <tr>
            <th>seq ↑</th>
            <th>date</th>
            <th>time</th>
            <th>format</th>
            <th>codename</th>
            <th>venue</th>
        </tr>
        {% for row in table %}
        <tr>
            <td>{{ row.meeting.seq }}</td>
            <td>{{ row.meeting.date }}</td>
            <td>{{ row.meeting.time }}</td>
            <td>{{ row.meeting.format.to_string() }}</td>
            <td><a href="/meetings/{{ row.meeting.seq }}">{{ row.meeting.codename }}</a></td>
            <td><a href="/venues/{{ row.venue.id }}">{{ row.venue.name }}</a></td>
        </tr>
        {% endfor %}
    </table>
</div>
