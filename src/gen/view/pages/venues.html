{# vim:ft=htmldjango:
#}
<h2>Hosts</h2>
<p>Venues which have hosted at least one meeting.</p>
<div class="records-list">
    <table>
        <tr>
            <th>name</th>
            <th>town</th>
            <th>contact</th>
            {# TODO Number of meetings hosted. #}
        </tr>
        {% for row in table %}
        <tr>
            <td><a href="/venues/{{ row.venue.id }}">{{ row.venue.name }}</a></td>
            <td>{{ row.venue.addr.town }}</td>
            {# TODO Lookup contact name. #}
            <td><a href="/people/{{ row.contact.id }}">{{ row.contact.name }}</a></td>
        </tr>
        {% endfor %}
    </table>
</div>
